[project]
name = "fabrica-autopartes"
version = "2.0.0"
description = "Base de conocimiento semántico y sistema Q&A (Resumen, FAQ, Q&A) para Fábrica Nacional de Autopartes (Fanalca) — Taller 1, Módulo 1."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    # Extracción (scraping) y limpieza
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "trafilatura>=2.0",
    # Orquestación LLM (LangChain, recomendado por el taller)
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-openai>=1.0,<2",
    # Configuración, validación y datos
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pandas>=2.2",
    # Persistencia de auditoría
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    # API e interfaz
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    # Integración MCP  # SDK 2.x: MCPServer (antes FastMCP),
    "mcp>=2.0,<3",
    "matplotlib>=3.11.2",
    "psycopg[binary]>=3.3.8",
    "trimesh>=5.2.0",
    "manifold3d>=3.5.4",
    "numpy>=2.5.4",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0,<2"]
dinamico = ["playwright>=1.47"]

[project.urls]
Repository = "https://github.com/JulianReneMunoz/fabrica-nacional-autopartes"

[project.scripts]
fabrica = "fabrica_autopartes.cli:main"
fabrica-mcp = "fabrica_autopartes.mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-requests",
    "types-PyYAML",
    "pgserver>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabrica_autopartes"]

[tool.hatch.build.targets.wheel.force-include]
"src/fabrica_autopartes/llm/prompts" = "fabrica_autopartes/llm/prompts"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "red: requiere acceso a Internet (excluida por defecto en CI)",
    "llm: requiere un proveedor LLM real (Ollama/OpenAI/Anthropic)",
]

[tool.coverage.run]
source = ["fabrica_autopartes"]
omit = ["src/fabrica_autopartes/scraping/dinamico.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # caracteres en español (tildes, comillas tipográficas)
    "UP046",  # Pydantic genérico con Generic[T] por legibilidad
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
packages = ["fabrica_autopartes"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
