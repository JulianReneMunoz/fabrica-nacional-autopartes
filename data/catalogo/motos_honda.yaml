    descripcion: "Sitio oficial de Honda Motos Colombia. robots.txt permite el acceso (Allow: /). Las páginas de producto respondieron HTTP 307 sin cuerpo a la lectura automatizada: no se siguen redirecciones ni se prueban variantes. Sin página de producto de la CB 160F en el sitemap."
