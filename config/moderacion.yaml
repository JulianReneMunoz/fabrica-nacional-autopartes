# Léxico de la moderación básica de IGNIS (services/moderacion.py, caso 6 del OpenSpec casos-validacion-ignis).
# Todo va en minúsculas y sin tildes: el mensaje se normaliza igual antes de comparar. Cada entrada se busca como
# palabra o frase completa. Los textos de respuesta viven en el código (fijos y probados), no aquí.
#
# Falsos positivos del negocio que NO deben bloquearse: «compactadoras de basura» (negocio Ambiental), «peso bruto»
# (dato técnico) y «hp» (caballos de fuerza). Por eso «basura» y «bruto» solo cuentan en frases dirigidas
# («eres una basura») y «hp» no está en las groserías.
version: 1

# Señales de autolesión o desesperanza (mejor pecar de cuidado): siempre se responde con calidez y con las líneas
# de ayuda (Línea 192, opción 4, de salud mental del Ministerio de Salud, y 123 para emergencias).
crisis_personal:
  - quiero morir
  - me quiero morir
  - quiero matarme
  - me quiero matar
  - me voy a matar
  - matarme
  - me mato
  - suicidar
  - suicidarme
