# Amenazas. Regla (services/moderacion.py):
# - Un verbo de amenaza_verbos se reconoce como infinitivo o como prefijo de la palabra, para admitir pronombres
#   enclíticos («matarte», «matarlos», «quemarles», «incendiarla»).
# - Los enclíticos te, le, les y nos siempre son el objetivo: «voy a matarte» y «voy a quemarles la sede» son
#   amenazas.
# - Los enclíticos lo, la, los y las solo son el objetivo con los verbos contra personas
#   (amenaza_verbos_contra_personas): «voy a matarlo» es una amenaza. Con los demás verbos (quemar, incendiar,
#   volar, explotar, destruir, reventar, atacar, disparar) pueden referirse a una cosa y se exige un objetivo
#   cerca: «¿Cómo explotarla al máximo la moto?» y «¿Cómo reventarla?» no son amenazas.
# - amenaza_formas son formas conjugadas que cuentan como verbo (palabra exacta, sin prefijos). No cuentan cuando
#   van justo después de «se» (uso impersonal o reflexivo): «¿Se quemó la planta?» no es una amenaza, pero «les
#   quemo la sede» sí.
# - Sin enclítico, el verbo y una palabra de amenaza_objetivos deben estar a 4 palabras o menos de distancia
#   («les voy a quemar la planta»). «Matar el motor en frío» no es amenaza: «motor» no es un objetivo.
# - «¿Hubo un incendio en la planta?» no es amenaza: «incendio» no empieza por el infinitivo «incendiar».
# - Las señales de crisis_personal se evalúan antes («me quiero matar» no es una amenaza contra otros).
amenaza_verbos:
  - matar
  - asesinar
  - golpear
  - quemar
  - incendiar
  - apunalar
  - disparar
  - balear
  - atacar
  - secuestrar
  - herir
  - lastimar
  - volar
  - explotar
  - destruir
  - reventar
# Subconjunto de amenaza_verbos que solo se dirige a personas (con ellos, lo/la/los/las ya son el objetivo).
